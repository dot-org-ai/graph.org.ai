# Legal Knowledge Virtual Taxonomy
# Complete configuration for law.org.ai

# Basic metadata
domain: law.org.ai
title: Legal Knowledge Graph
tagline: Legal Concepts, Contracts, and Compliance
description: |
  Comprehensive taxonomy of legal knowledge including legal occupations,
  compliance processes, regulatory frameworks, and legal services.
  Covers corporate law, litigation, contracts, regulatory compliance,
  and legal technology.

# Visual identity
category: functional-domain
icon: Scale
color: "#2C3E50"
theme: legal

# Taxonomy relationships
parent: null
children: []
related:
  - compliance.org.ai       # Regulatory compliance
  - hr.org.ai               # Employment law
  - finance.org.ai          # Financial regulations

# Source domain filters
sources:

  # Industries (NAICS) - Legal services
  industries:
    include:
      naics_codes:
        - "5411"  # Legal Services
        - "92"    # Public Administration (courts, etc.)
      keywords:
        - legal
        - law
        - court
        - justice

  # Occupations (O*NET/SOC)
  occupations:
    include:
      # SOC major groups
      soc_major_groups:
        - "23"  # Legal Occupations

      # Specific SOC codes
      soc_codes:
        - "23-1011"  # Lawyers
        - "23-1021"  # Administrative Law Judges
        - "23-1022"  # Arbitrators, Mediators
        - "23-1023"  # Judges, Magistrates
        - "23-2011"  # Paralegals and Legal Assistants
        - "23-2092"  # Law Clerks
        - "23-2093"  # Title Examiners
        - "13-1041"  # Compliance Officers

      # Title keywords
      title_keywords:
        - lawyer
        - attorney
        - paralegal
        - legal
        - judge
        - magistrate
        - arbitrator
        - mediator
        - compliance officer
        - legal assistant
        - law clerk

      # Career clusters
      career_clusters:
        - "Public Service & Safety"

    score:
      soc_23: 1.0           # Legal occupations
      compliance: 0.9       # Compliance officers
      title_keyword: 0.8

  # Processes (APQC)
  processes:
    include:
      # APQC categories
      categories:
        - "2.1"   # Manage legal and ethical issues
        - "2.1.1" # Manage intellectual property
        - "2.1.2" # Manage litigation
        - "2.1.3" # Manage legal compliance
        - "2.2"   # Manage environmental health and safety (EHS)
        - "2.3"   # Manage security and continuity
        - "10.1"  # Manage legal and compliance

      # Keywords
      keywords:
        - legal
        - compliance
        - regulatory
        - contract
        - litigation
        - intellectual property
        - patent
        - trademark
        - copyright
        - governance
        - ethics
        - audit
        - law
        - regulation
        - statute

    score:
      category_2_1: 1.0     # Legal processes
      category_10_1: 1.0    # Legal compliance
      keyword_match: 0.7

  # Tasks (O*NET)
  tasks:
    include:
      from_occupations: auto

      # Additional keywords
      keywords:
        - legal
        - contract
        - compliance
        - regulation
        - law
        - statute
        - litigation
        - court
        - brief
        - case
        - precedent
        - evidence

      # DWA categories
      dwa_keywords:
        - "Evaluating Information to Determine Compliance"
        - "Resolving Conflicts and Negotiating with Others"
        - "Interpreting the Meaning of Information for Others"

    score:
      from_occupation: 1.0
      dwa_match: 0.9
      keyword_match: 0.7

  # Skills (O*NET)
  skills:
    include:
      from_occupations: auto

      keywords:
        - legal
        - negotiation
        - writing
        - reading comprehension
        - critical thinking
        - active listening
        - judgment
        - persuasion

    score:
      from_occupation: 1.0
      keyword_match: 0.8

  # Knowledge (O*NET)
  knowledge:
    include:
      from_occupations: auto

      keywords:
        - law
        - legal
        - government
        - administrative
        - English language
        - customer service

    score:
      from_occupation: 1.0
      keyword_match: 0.9

  # Work Activities (O*NET)
  work_activities:
    include:
      from_occupations: auto

      dwa_keywords:
        - "Evaluating Information to Determine Compliance"
        - "Resolving Conflicts and Negotiating"
        - "Making Decisions and Solving Problems"
        - "Interpreting the Meaning of Information"
        - "Communicating with People Outside the Organization"

    score:
      from_occupation: 1.0
      dwa_match: 0.95

  # Services (NAPCS)
  services:
    include:
      codes:
        - "5411"  # Legal services

      keywords:
        - legal
        - law
        - attorney
        - litigation
        - contract

    score:
      code_match: 1.0
      keyword_match: 0.8

  # Technologies & Tools
  technologies:
    include:
      from_occupations: auto

      keywords:
        - legal research
        - case management
        - document management
        - e-discovery
        - contract management
        - compliance software
        - westlaw
        - lexisnexis

    score:
      from_occupation: 1.0
      keyword_match: 0.9

# Entity types
types:
  - name: Occupation
    source: occupations.org.ai
    icon: Users
    count_estimate: 40
    description: Legal occupations and roles

  - name: Process
    source: processes.org.ai
    icon: GitBranch
    count_estimate: 150
    description: Legal and compliance processes

  - name: Task
    source: occupations.org.ai
    icon: CheckSquare
    count_estimate: 400
    description: Legal tasks and activities

  - name: Skill
    source: occupations.org.ai
    icon: Award
    count_estimate: 80
    description: Legal skills

  - name: Knowledge
    source: occupations.org.ai
    icon: BookOpen
    count_estimate: 50
    description: Legal knowledge areas

  - name: Service
    source: services.org.ai
    icon: Briefcase
    count_estimate: 100
    description: Legal services

  - name: Tool
    source: occupations.org.ai
    icon: Tool
    count_estimate: 50
    description: Legal technology tools

  - name: Industry
    source: industries.org.ai
    icon: Building
    count_estimate: 10
    description: Legal industry classifications

# Future custom entity types
custom_types:
  - name: Contract
    description: Legal contract templates and clauses
    icon: FileText
    source: future
    fields:
      - contract_type
      - parties
      - clauses
      - jurisdiction

  - name: Regulation
    description: Legal regulations and requirements
    icon: BookOpen
    source: future
    fields:
      - regulation_id
      - jurisdiction
      - effective_date
      - requirements

  - name: Case
    description: Legal case references and precedents
    icon: Scale
    source: future
    fields:
      - case_number
      - court
      - date
      - outcome

  - name: Statute
    description: Legal statutes and laws
    icon: Book
    source: future
    fields:
      - statute_id
      - jurisdiction
      - enacted_date
      - text

# Navigation
navigation:
  primary:
    - Occupations
    - Processes
    - Services

  secondary:
    - Tasks
    - Skills
    - Knowledge
    - Tools
    - Industries

  future:
    - Contracts
    - Regulations
    - Cases
    - Statutes

# Search and discovery
tags:
  - legal
  - law
  - compliance
  - regulatory
  - contracts
  - litigation
  - intellectual-property
  - corporate-law
  - legal-tech

seo:
  keywords:
    - legal careers
    - law jobs
    - compliance processes
    - legal services
    - contract management
    - regulatory compliance
    - legal technology

# Metrics
metrics:
  enabled: true
  track:
    - entity_count_by_type
    - compliance_coverage
    - legal_service_types
    - technology_adoption

  dashboards:
    - name: Legal Overview
      widgets:
        - type: entity_counts
        - type: occupation_distribution

    - name: Compliance
      widgets:
        - type: compliance_processes
        - type: regulatory_coverage

# Sample queries
sample_queries:
  - title: All Legal Occupations
    query: |
      SELECT * FROM law_occupations
      ORDER BY employment DESC

  - title: Compliance Processes
    query: |
      SELECT * FROM law_processes
      WHERE name ILIKE '%compliance%'

  - title: Legal Research Skills
    query: |
      SELECT * FROM law_skills
      WHERE name ILIKE '%research%'
      OR name ILIKE '%legal%'

# Version
version: 1.0.0
last_updated: 2025-11-22
changelog:
  - version: 1.0.0
    date: 2025-11-22
    changes:
      - Initial legal taxonomy configuration
      - Defined core legal occupations and processes
      - Added future custom entity types (contracts, regulations)
      - Configured compliance-focused metrics
